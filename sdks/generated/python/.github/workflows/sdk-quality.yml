# Generated by Octri SDK Studio.
# Source generation happens in Octri; native quality gates run in this repository.
name: SDK Quality
# A repair run's head_sha is whatever the branch head is when the dispatch
# lands, which can already be a newer commit, so Octri reads the commit a repair
# run verified from this title. The fallbacks keep GitHub's usual titles, since
# an empty run-name would show only the workflow name.
run-name: ${{ inputs.octri_fix_sha && format('Verify repair {0}', inputs.octri_fix_sha) || github.event.head_commit.message || github.event.pull_request.title || github.workflow }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      octri_fix_sha:
        description: "Exact formatter/linter fix commit to verify"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep push and explicit repair-verification runs in separate lanes. A
  # dispatch created by the format job must not cancel that job before it can
  # publish its handoff output.
  group: sdk-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      handed_off: ${{ steps.handoff.outputs.handed_off }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The initial run and every check job use the immutable event SHA. A
          # dispatched repair run pins the exact commit that was just pushed.
          ref: ${{ inputs.octri_fix_sha || github.sha }}
      - name: Verify dispatched fix commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.octri_fix_sha != '' }}
        env:
          OCTRI_FIX_SHA: ${{ inputs.octri_fix_sha }}
        shell: bash
        run: |
          if [[ ! "$OCTRI_FIX_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::octri_fix_sha must be a full 40-character commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$OCTRI_FIX_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - name: Safe lint fixes
        run: ruff check --fix . || test $? -eq 1
      - name: Format
        run: ruff format .
      - name: Push formatting fixes
        id: handoff
        # GITHUB_TOKEN pushes do not trigger another workflow run. Dispatch the
        # exact pushed SHA explicitly, and let this run skip the downstream jobs.
        if: ${{ success() && github.event_name == 'push' && github.ref_type == 'branch' && inputs.octri_fix_sha == '' }}
        env:
          OCTRI_FORMAT_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          echo "handed_off=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "octri-sdk-bot"
          git config user.email "octri-sdk-bot@users.noreply.github.com"
          git diff --check
          WORKFLOW_STATUS="$(curl --silent --show-error \
            -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/sdk-quality.yml")"
          if [ "${WORKFLOW_STATUS}" != "200" ]; then
            echo "::error::sdk-quality.yml is not available on the repository default branch; repair handoff cannot be dispatched (HTTP ${WORKFLOW_STATUS})"
            exit 1
          fi
          git add -u
          git commit -m "chore: apply SDK formatting"
          git push origin "HEAD:refs/heads/${OCTRI_FORMAT_BRANCH}"
          FIX_SHA="$(git rev-parse HEAD)"
          PAYLOAD="$(jq -cn --arg ref "$OCTRI_FORMAT_BRANCH" --arg sha "$FIX_SHA" \
            '{ref:$ref,inputs:{octri_fix_sha:$sha}}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/sdk-quality.yml/dispatches"
          echo "handed_off=true" >> "$GITHUB_OUTPUT"
      - name: Verify dispatched tree is clean
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: format
    if: ${{ always() && needs.format.outputs.handed_off != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The initial run and every check job use the immutable event SHA. A
          # dispatched repair run pins the exact commit that was just pushed.
          ref: ${{ inputs.octri_fix_sha || github.sha }}
      - name: Verify dispatched fix commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.octri_fix_sha != '' }}
        env:
          OCTRI_FIX_SHA: ${{ inputs.octri_fix_sha }}
        shell: bash
        run: |
          if [[ ! "$OCTRI_FIX_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::octri_fix_sha must be a full 40-character commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$OCTRI_FIX_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .

  compile:
    name: Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: format
    if: ${{ always() && needs.format.outputs.handed_off != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The initial run and every check job use the immutable event SHA. A
          # dispatched repair run pins the exact commit that was just pushed.
          ref: ${{ inputs.octri_fix_sha || github.sha }}
      - name: Verify dispatched fix commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.octri_fix_sha != '' }}
        env:
          OCTRI_FIX_SHA: ${{ inputs.octri_fix_sha }}
        shell: bash
        run: |
          if [[ ! "$OCTRI_FIX_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::octri_fix_sha must be a full 40-character commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$OCTRI_FIX_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - name: Compile
        run: mypy .

  native_tests:
    name: Native and mock-server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: format
    if: ${{ always() && needs.format.outputs.handed_off != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The initial run and every check job use the immutable event SHA. A
          # dispatched repair run pins the exact commit that was just pushed.
          ref: ${{ inputs.octri_fix_sha || github.sha }}
      - name: Verify dispatched fix commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.octri_fix_sha != '' }}
        env:
          OCTRI_FIX_SHA: ${{ inputs.octri_fix_sha }}
        shell: bash
        run: |
          if [[ ! "$OCTRI_FIX_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::octri_fix_sha must be a full 40-character commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$OCTRI_FIX_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - name: Native and mock-server tests
        run: ./scripts/test

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: format
    if: ${{ always() && needs.format.outputs.handed_off != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The initial run and every check job use the immutable event SHA. A
          # dispatched repair run pins the exact commit that was just pushed.
          ref: ${{ inputs.octri_fix_sha || github.sha }}
      - name: Verify dispatched fix commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.octri_fix_sha != '' }}
        env:
          OCTRI_FIX_SHA: ${{ inputs.octri_fix_sha }}
        shell: bash
        run: |
          if [[ ! "$OCTRI_FIX_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::octri_fix_sha must be a full 40-character commit SHA"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$OCTRI_FIX_SHA"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - name: Package
        run: python -m build
